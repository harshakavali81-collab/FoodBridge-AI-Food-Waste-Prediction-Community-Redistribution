<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Responsible impact accounting"><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071a1a"/><stop offset="1" stop-color="#174438"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#83ebad"/></marker></defs><rect width="1200" height="590" fill="url(#bg)"/><text x="48" y="50" fill="#83ebad" font-family="Arial,sans-serif" font-size="19">F O O D B R I D G E     A I</text><text x="48" y="109" fill="#e4fff4" font-family="Arial,sans-serif" font-size="39">Responsible impact accounting</text><text x="48" y="145" fill="#b8d4cd" font-family="Arial,sans-serif" font-size="19">Listed and reserved quantities are not confirmed collections.</text><rect x="52" y="223" width="318" height="183" rx="18" fill="#163b34" stroke="#40816c" stroke-width="2"/><rect x="69" y="241" width="6" height="30" rx="3" fill="#83ebad"/><text x="89" y="266" fill="#e4fff4" font-family="Arial,sans-serif" font-size="22">LISTED</text><text x="72" y="310" fill="#c1d7d2" font-family="Arial,sans-serif" font-size="16">Real inventory only</text><path d="M376 307h42" stroke="#83ebad" stroke-width="4" marker-end="url(#a)"/><rect x="426" y="223" width="318" height="183" rx="18" fill="#163b34" stroke="#40816c" stroke-width="2"/><rect x="443" y="241" width="6" height="30" rx="3" fill="#83ebad"/><text x="463" y="266" fill="#e4fff4" font-family="Arial,sans-serif" font-size="22">RESERVED</text><text x="446" y="310" fill="#c1d7d2" font-family="Arial,sans-serif" font-size="16">Pickup still pending</text><path d="M754 307h41" stroke="#83ebad" stroke-width="4" marker-end="url(#a)"/><rect x="805" y="223" width="344" height="183" rx="18" fill="#163b34" stroke="#40816c" stroke-width="2"/><rect x="822" y="241" width="6" height="30" rx="3" fill="#83ebad"/><text x="842" y="266" fill="#e4fff4" font-family="Arial,sans-serif" font-size="22">COLLECTED</text><text x="825" y="310" fill="#c1d7d2" font-family="Arial,sans-serif" font-size="16">Human-confirmed event</text><text x="116" y="481" fill="#f0c88f" font-family="Arial,sans-serif" font-size="19">Never claim meals served or CO2 avoided without separate validation.</text><rect y="543" width="1200" height="47" fill="#071d1a"/><text x="47" y="572" fill="#abcfc0" font-family="Arial,sans-serif" font-size="16">PORTFOLIO PROTOTYPE  |  SYNTHETIC DATA  |  HUMAN SAFETY REVIEW</text></svg>