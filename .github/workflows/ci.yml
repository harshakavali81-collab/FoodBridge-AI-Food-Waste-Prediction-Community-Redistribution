name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - run: python scripts/generate_synthetic.py
      - run: python -m pytest
        env: { PYTHONPATH: '.:src' }
      - run: python -m foodbridge.forecasting.train --data data/synthetic/daily_operations.csv --output models
        env: { PYTHONPATH: '.:src' }
      - name: Validate fake production config fails closed
        env:
          APP_ENV: production
          SEED_DEMO_DATA: 'false'
          DATABASE_URL: postgresql+psycopg://local:dev@localhost:5432/foodbridge
          API_KEY: ThisIsOnlyATestConfigurationKeyNotForUse
          CORS_ORIGINS: ''
        run: PYTHONPATH=.:src python scripts/check_deployment.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run build
  static-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Pages assets and ignore rules
        run: |
          python - <<'PY'
          from pathlib import Path
          assert len(list(Path('docs/assets').glob('*.svg'))) == 10
          assert Path('docs/index.html').exists()
          assert Path('docs/demo.html').exists()
          assert Path('docs/launch-readiness.html').exists()
          assert not Path('.env.staging').exists()
          assert '.env.*' in Path('.gitignore').read_text()
          assert 'localStorage' not in Path('frontend/src/api/client.js').read_text()
          assert Path('SECURITY.md').exists()
          print("Static and repository safety checks passed")
          PY
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: foodbridge_test
          POSTGRES_USER: fb_test
          POSTGRES_PASSWORD: local_test_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fb_test -d foodbridge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: production
      SEED_DEMO_DATA: 'false'
      ENABLE_REAL_OPERATIONS: 'false'
      DATABASE_URL: postgresql+psycopg://fb_test:local_test_password@localhost:5432/foodbridge_test
      FOODBRIDGE_TEST_POSTGRES_URL: postgresql+psycopg://fb_test:local_test_password@localhost:5432/foodbridge_test
      API_KEY: GitHubActionsDisposableTestKeyNotForAnyRealDeployment
      CORS_ORIGINS: ''
      PYTHONPATH: '.:src'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements.txt
      - name: Validate the fail-closed internal staging configuration
        run: python scripts/check_deployment.py
      - name: Apply both Alembic migrations to disposable PostgreSQL
        run: python scripts/init_schema_for_staging.py
      - name: Validate schema and tenant-scoped review constraint on PostgreSQL
        run: python -m pytest tests/test_postgres_integration.py -q
      - name: Verify migration is idempotent
        run: python scripts/init_schema_for_staging.py
      - name: Dump and restore an isolated PostgreSQL snapshot (CI only)
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: python scripts/verify_backup_restore_ci.py
